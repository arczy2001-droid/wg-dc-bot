[package]
name = "sf_login_check"
version = "0.1.0"
edition = "2021"

# Interactive login checker (human-facing, prompts on the terminal)
[[bin]]
name = "sf_login_check"
path = "sf_login_check.rs"

# Machine-readable guild-status probe used by the Python Discord bot.
# Reads "server\nusername\npassword" on stdin, prints one JSON line on stdout.
[[bin]]
name = "sf_probe"
path = "sf_probe.rs"

# Machine-readable guild ATTACK REPORT probe. Fetches the newest guild attack
# battle report and prints its raw messagetext body as JSON, so the Python side
# can extract the list of absent members. Same stdin/stdout contract as sf_probe.
[[bin]]
name = "sf_report_probe"
path = "sf_report_probe.rs"

[dependencies]
# The real Shakes & Fidget API crate — https://github.com/the-marenga/sf-api
sf-api = "0.4"
base64 = "0.22"

# Async runtime, required by sf-api's session/login calls
tokio = { version = "1", features = ["full"] }

# Masks password input in the terminal (used only by sf_login_check)
rpassword = "7"

[[bin]]
name = "sf_report_diag"
path = "sf_report_diag.rs"

[[bin]]
name = "sf_members_diag"
path = "sf_members_diag.rs"
